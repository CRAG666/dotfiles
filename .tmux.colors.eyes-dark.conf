# ─── eyes (light) theme ──────────────────────────────────────────────────────
# Palette:
#   bg0  #192019   bg1  #1f271f   bg3  #2c372c   bg4  #3a463a   bg5  #667366
#   fg0  #e4e0cc   fg1  #d0d4be   fg2  #bbc7b0
#   red  #ffbab1   green #bfe6a1  yellow #f1de95  blue #a2cdf7
#   teal #95ded1   violet #d5c9fc  pink #efb7db  ash  #9fb9a1

# Pane borders
set -g pane-border-style fg='#3a463a'
set -g pane-active-border-style fg='#a2cdf7'

# Messages / command prompt
set -g message-style bg='#1f271f',fg='#e4e0cc'
set -g message-command-style bg='#1f271f',fg='#e4e0cc'

# Status bar
set -g status-style bg='#1f271f',fg='#e4e0cc'
set -g status-interval 1
set -g status-justify left

# Left: prefix indicator + zoom
set -g status-left '#[bg=#1f271f,fg=#a2cdf7,bold]#{?client_prefix,#[bg=#ffbab1#,fg=#192019],}  '
set -ga status-left '#[bg=#1f271f,fg=#ffbab1]#{?window_zoomed_flag, ↕  ,   }'

# Window status (inactive / active)
set-window-option -g window-status-style fg='#bbc7b0',bg='#1f271f'
set-window-option -g window-status-current-style fg='#192019',bg='#a2cdf7',bold
set -g window-status-current-format "#[fg=#1f271f,bg=#a2cdf7]#[fg=#192019,bg=#a2cdf7,bold] #I  #W #[fg=#a2cdf7,bg=#1f271f]"
set -g window-status-format "#[fg=#1f271f,bg=#3a463a]#[fg=#e4e0cc,bg=#3a463a] #I  #W #[fg=#3a463a,bg=#1f271f]"

# Right: session, pane, window
set -g status-right '#[fg=#3a463a,bg=#1f271f]#[fg=#e4e0cc,bg=#3a463a]  #S '
set -ga status-right '#[fg=#d5c9fc,bg=#3a463a]#[fg=#192019,bg=#d5c9fc]  #P '
set -ga status-right '#[fg=#ffbab1,bg=#d5c9fc]#[fg=#192019,bg=#ffbab1]  %H:%M '

# Clock mode
set -g clock-mode-colour '#a2cdf7'
set -g clock-mode-style 24

# Copy mode highlight
set -g mode-style bg='#a2cdf7',fg='#192019'
