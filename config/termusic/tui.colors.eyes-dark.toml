# Colores del tema eyes (dark) — solo tablas [theme*]. Par manual con
# tui.colors.eyes.toml (el mapeo dark usa ANSI cruzados, no PALETTE sed).
[theme]
file_name = "eyes-active"
name = "Eyes (light)"
author = "Crag"

[theme.primary]
background = "#1a211a"
foreground = "#d0dcc8"

[theme.cursor]
text = "#1a211a"
cursor = "#d0dcc8"

[theme.normal]
black = "#1a211a"
red = "#c87868"
green = "#88b878"
yellow = "#d4b85a"
blue = "#82aab8"
magenta = "#b890b0"
cyan = "#6ab8b0"
white = "#b8c8b0"

[theme.bright]
black = "#3a463a"
red = "#c87868"
green = "#7aab72"
yellow = "#b89a6a"
blue = "#6a94a8"
magenta = "#9090b8"
cyan = "#5ab8a8"
white = "#d0dcc8"

