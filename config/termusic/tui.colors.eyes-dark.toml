# eyes theme colors (dark) — [theme*] tables only. Manual pair with
# tui.colors.eyes.toml (the dark mapping uses crossed ANSI, not PALETTE sed).
[theme]
file_name = "eyes-active"
name = "Eyes (light)"
author = "Crag"

[theme.primary]
background = "#192019"
foreground = "#e4e0cc"

[theme.cursor]
text = "#192019"
cursor = "#e4e0cc"

[theme.normal]
black = "#192019"
red = "#ffbab1"
green = "#96d4a6"
yellow = "#f1de95"
blue = "#a8d7f0"
magenta = "#efb7db"
cyan = "#96d4e2"
white = "#d0d4be"

[theme.bright]
black = "#3a463a"
red = "#ffbab1"
green = "#bfe6a1"
yellow = "#f7bc95"
blue = "#a2cdf7"
magenta = "#d5c9fc"
cyan = "#95ded1"
white = "#e4e0cc"

