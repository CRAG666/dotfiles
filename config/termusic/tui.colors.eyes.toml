# Colores del tema eyes (light) — solo tablas [theme*]. Editar aquí y en
# tui.colors.eyes-dark.toml (par manual: el mapeo dark usa ANSI cruzados).
[theme]
file_name = "eyes-active"
name = "Eyes (light)"
author = "Crag"

[theme.primary]
background = "#add4a0"
foreground = "#1a1a1a"

[theme.cursor]
text = "#add4a0"
cursor = "#1a1a1a"

[theme.normal]
black = "#1a1a1a"
red = "#7a1e18"
green = "#1e4a18"
yellow = "#5a4808"
blue = "#143c52"
magenta = "#3a2860"
cyan = "#1a5858"
white = "#88b07e"

[theme.bright]
black = "#486040"
red = "#7a1e18"
green = "#2a5c22"
yellow = "#7a4a18"
blue = "#1e4868"
magenta = "#5a2858"
cyan = "#145850"
white = "#a4cc98"

