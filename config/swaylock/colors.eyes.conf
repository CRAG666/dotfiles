# `eyes-theme generate` (PALETTE sed, with RRGGBBAA alpha support).
color=add4a080

# idle / typing
inside-color=add4a0
line-color=add4a0
ring-color=2a5c22
text-color=1a1a1a
key-hl-color=145850
bs-hl-color=7a1e18
