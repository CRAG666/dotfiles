# Base de swaylock SIN colores (efectos, fuente, geometría).
# config lo ensambla eyes-theme: base.conf + colors.eyes[-dark].conf.
daemonize
show-failed-attempts
clock
screenshot
effect-blur=15x15
effect-vignette=1:1
font="SFPro Nerd Font Propo Text"
indicator
indicator-radius=200
indicator-thickness=20

grace=2
grace-no-mouse
grace-no-touch
datestr=%a, %B %e
timestr=%I:%M %p
fade-in=0.3
ignore-empty-password
