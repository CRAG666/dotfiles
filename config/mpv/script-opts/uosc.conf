# uosc — modern/minimal look. COLORS don't go here: they live in
# config/mpv/colors.conf (symlink switched by eyes-theme via
# script-opts-append=uosc-color=..., which takes precedence over this file).

# Timeline: thin line that expands as the cursor approaches
timeline_style=line
timeline_line_width=3
timeline_size=44
timeline_border=0
timeline_cache=yes
timeline_heatmap=overlay

# Minimal progress bar always visible in windowed mode
progress=windowed
progress_size=2

# Controls: utilities on the left, transport centered, toggles on the right
controls=menu,gap,<video,audio>subtitles,<has_many_audio>audio,<has_many_video>video,<has_many_edition>editions,<stream>stream-quality,space,prev,play-pause,next,space,shuffle,loop-playlist,loop-file,gap,<video,audio>speed,gap,fullscreen
controls_size=36
controls_margin=10
controls_spacing=4

# Vertical volume on the right
volume=right
volume_size=44
volume_border=0

# Wider, more comfortable menus
menu_item_height=40
menu_min_width=280
menu_padding=6

# Top bar with title (border=no in mpv.conf enables it)
top_bar=no-border
top_bar_size=44
top_bar_controls=right
top_bar_title=yes

# General aesthetics
border_radius=10
animation_duration=150
scale=1
scale_fullscreen=1
font_scale=1
font_bold=no
text_border=1.2

# The UI fades out along with the cursor (cursor-autohide in mpv.conf)
autohide=yes
pause_indicator=flash

# Chapter ranges tinted with eyes palette accents (teal/red with alpha;
# overlaid on video, they work in both modes)
chapter_ranges=openings:95ded160,endings:95ded160,ads:ffbab180

destination_time=playtime-remaining
adjust_osd_margins=yes
