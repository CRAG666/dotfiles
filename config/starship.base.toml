# starship base WITHOUT an active palette (format, modules, [palettes.*] tables).
# eyes-theme assembles starship.toml: palette.variant + base (the top-level
# palette key must precede the TOML tables).
add_newline = false
format = """$all"""
# right_format = """$all"""

[character]
# success_symbol = "[ﰉ](fg:red)[ ﰉ](fg:yellow)[ ﰉ](fg:cyan)"
success_symbol = "[ﰉ](fg:red)[ ﰉ](fg:yellow)[ ﰉ](fg:green)"
# vicmd_symbol = "[ﰊ](fg:cyan)[ ﰊ](fg:yellow)[ ﰊ](fg:red)"
vicmd_symbol = "[ﰊ](fg:green)[ ﰊ](fg:yellow)[ ﰊ](fg:red)"
error_symbol = "[ﰉ](fg:red)"

[git_metrics]
disabled = false

[directory.substitutions]
"~/Escritorio" = "󰇄"
"~/Descargas" = ""
"~/Documentos" = ""
"~/Imágenes" = ""
"~/Música" = ""
"~/Vídeos" = ""
"~/Git" = ""
"/run/media/$USER" = "󱊞"
"~/Desktop" = "󰇄"
"~/Downloads" = ""
"~/Documents" = ""
"~/Pictures" = ""
"~/Music" = ""
"~/Videos" = ""

