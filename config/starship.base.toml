# starship base WITHOUT an active palette (format, modules, [palettes.*] tables).
# eyes-theme assembles starship.toml: palette.variant + base (the top-level
# palette key must precede the TOML tables).
add_newline = false
format = """$all"""
# right_format = """$all"""

[character]
# success_symbol = "[◆](fg:red)[ ◆](fg:yellow)[ ◆](fg:cyan)"
success_symbol = "[◆](fg:red)[ ◆](fg:yellow)[ ◆](fg:green)"
# vicmd_symbol = "[◇](fg:cyan)[ ◇](fg:yellow)[ ◇](fg:red)"
vicmd_symbol = "[◇](fg:green)[ ◇](fg:yellow)[ ◇](fg:red)"
error_symbol = "[◆](fg:red)"

[git_metrics]
disabled = false

[directory.substitutions]
"~/Escritorio" = "󰇄"
"~/Descargas" = "󰅢"
"~/Documentos" = "󰈙"
"~/Imágenes" = "󰋹"
"~/Música" = ""
"~/Vídeos" = ""
"~/Git" = "󰊢"
"/run/media/$USER" = "󱊞"
"~/Desktop" = "󰇄"
"~/Downloads" = "󰅢"
"~/Documents" = "󰈙"
"~/Pictures" = "󰋹"
"~/Music" = ""
"~/Videos" = ""

