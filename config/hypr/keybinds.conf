#### Bind flag definitions ####
# l -> locked (works even with an input inhibitor active, e.g. lock screen)
# r -> release (when the key is released)
# o -> long press (after a prolonged hold)
# e -> repeat (while held down)
# n -> non-consuming (event propagates to the active window)
# m -> mouse (use with mouse submaps)
# t -> transparent (cannot be shadowed by other binds)
# i -> ignore mods (ignores modifiers)
# s -> separate (arbitrarily combines mods/keys; see Keysym combos)
# p -> bypasses app requests to inhibit keybinds

#### Environment variables ####
$SPOTLIGHT=~/.config/quickshell/spotlight/spotlight.sh
$VOL=~/.config/quickshell/osd/vol
$notifycmd=notify-send -h string:x-canonical-private-synchronous:hypr-cfg -u low
$RUN_TUI=kitty --class dialog

#### Mouse ####
bindd = SUPER, Space, Mover cursor, exec, wl-kbptr && hyprctl dispatch submap reset
bind  = SUPER, Space, submap, cursor
submap= cursor
  bind = , Escape, submap, reset
submap= reset

#### Application shortcuts ####
bindd = ALT,   Space,      Screen lock,    exec, hyprlock
bindd = SUPER, Backspace, Open power commands, exec, $SPOTLIGHT commands

bindd = SUPER, T, Open terminal,      exec, kitty
bindd = SUPER, V, Open clipboard,     exec, $SPOTLIGHT clipboard
bindd = ,      XF86Launch6, Open clipboard, exec, $SPOTLIGHT clipboard
bind  = ,      XF86Mail,   exec, betterbird
bindd = ,      XF86Search, Open Web Browser, exec, zen-browser

bindd = , XF86Launch5, FullScreen launcher, exec, qs kill -p ~/.config/quickshell/launcher.qml || qs -n -p ~/.config/quickshell/launcher.qml
bindd = , XF86Open,    Open Spotlight,     exec, $SPOTLIGHT
bindd = , XF86Launch7, Open run menu,      exec, $SPOTLIGHT run
bindd = , Find,        Open active apps,   exec, $SPOTLIGHT windows
bindd = , XF86Tools,   Open tools,         exec, $SPOTLIGHT tools
bindd = , XF86Favorites, Open bookmarks,   exec, $SPOTLIGHT bookmarks
bindd = SUPER, B, Open bookmarks quick links, exec, $SPOTLIGHT quicklinks
bindd = , XF86Go,       Open wifi menu, exec, $RUN_TUI -T impala impala
bindd = , XF86Explorer, Open File Manager, exec, $RUN_TUI -T yazi yazi
bindd = SUPER, C, Show credentials,    exec, $SPOTLIGHT passwords
bindd = SUPER, P, Open Notes, exec, $SPOTLIGHT notes

#### Media controls ####
# Volume
binde = , XF86AudioRaiseVolume, exec, $VOL up
binde = , XF86AudioLowerVolume, exec, $VOL down
bind  = , XF86AudioMute,        exec, $VOL mute
bind  = , XF86AudioPreset,      exec, pwvucontrol

# Playback
bindl = , XF86AudioPrev,     exec, playerctl previous
bindl = , XF86AudioNext,     exec, playerctl next
bindl = , XF86AudioPlay,     exec, playerctl --all-players play-pause
bindl = , XF86AudioMicMute,  exec, $VOL mic

#### Screenshots ####
bind = SUPER, Print, exec, hyprshot -m output -o ~/Screenshots
bind = ,      Print, exec, hyprshot -m region -o ~/Screenshots

#### Custom scripts ####
bind = SUPERALT, W, exec, $SPOTLIGHT wallpapers  # change wallpaper

#### Special workspaces ####
bind = SUPER,      A, togglespecialworkspace
bind = SUPERSHIFT, A, movetoworkspace, special
bind = SUPER,      G, togglespecialworkspace, AI
bind = SUPERSHIFT, G, movetoworkspace, AI

bind = SUPER, semicolon, focusmonitor, +1
bind = SUPERSHIFT, semicolon, movewindow, mon:+1

#### Resize mode ####
bind  = SUPER, R, submap, resize
bind  = SUPER, R, exec, $notifycmd 'Resize Mode'
submap = resize
  binde = , l, resizeactive,  100  0
  binde = , h, resizeactive,  -100 0
  binde = , k, resizeactive,   0  -100
  binde = , j, resizeactive,   0   100
bind  = , Escape, submap, reset
submap = reset

#### Mouse shortcuts ####
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, Control_L,    movewindow
bindm = SUPER, mouse:273, resizewindow
bindm = SUPER, ALT_L,       resizewindow

#### Minimize window ####
bind = SUPERSHIFT, S, togglespecialworkspace, magic
bind = SUPERSHIFT, S, movetoworkspace, +0
bind = SUPERSHIFT, S, togglespecialworkspace, magic
bind = SUPERSHIFT, S, movetoworkspace, special:magic
bind = SUPERSHIFT, S, togglespecialworkspace, magic

bind = SUPERCTRL, F, togglefloating,

bind = SUPERSHIFT,F,fullscreen,1
bind = SUPER, F, fullscreen, # Fullscreen Mode

# Floating Mode
bind = SUPERALT, F, workspaceopt, allfloat
bind = SUPERALT, F, exec, $notifycmd 'Toggled All Float Mode'

bind = SUPER, Q, killactive
