# eyes (dark) — forest-green palette for zsh-patina.

# comments (c_ash from nvim eyes)
"comment" = "#9fb9a1"

# strings (c_green0: farther from the blue commands than c_green1)
"string" = "#bfe6a1"

# regular expressions
"keyword.operator.regexp" = "#efb7db"

# escape characters (c_pink)
"constant.character" = "#efb7db"

# constants in general (c_orange0)
"constant" = "#f7bc95"

# numeric literals (c_pink to match nvim Number)
"constant.numeric" = "#efb7db"

# parameters
"variable.parameter" = "#f4cb94"

# environment variables
"variable.other" = "#ffbab1"
"punctuation.definition.variable" = "#ffbab1"

# commands
"variable.function" = "#a2cdf7"

# home directory ~
"variable.language.tilde" = "#ffbab1"

# keywords
"keyword" = "#d5c9fc"

# general foreground color
source = "#e4e0cc"

# variable assignments
"storage" = "#f1de95"
"storage.modifier" = "#d5c9fc"

# support terms (e.g. double braces, let)
"support" = "#a2cdf7"
"keyword.operator" = "#95ded1"

# function names (c_blue1 from nvim eyes)
"entity.name.function" = "#a8d7f0"

# braces (c_gray1 from nvim eyes)
"punctuation.section" = "#b6b4ac"

# terminators (e.g. ";;" after a case item)
"punctuation.terminator" = "#b6b4ac"

# history expansions
"meta.group.expansion.history" = "#ffbab1"

# reset command substitutions to the theme's default foreground color
"meta.group.expansion.command.parens" = { foreground = "#e4e0cc" }

# command call wrappers and option-argument values default to ANSI 7 (too dim)
"meta.function-call" = { foreground = "#e4e0cc" }
"meta.function-call.arguments" = { foreground = "#e4e0cc" }
"punctuation.definition.parameter" = { foreground = "#e4e0cc" }

# line-continuation backslash also defaults to ANSI 7 (dim grey on dark green)
"punctuation.separator.continuation.line" = "#b6b4ac"

# dynamic items
"dynamic.callable" = "#a2cdf7"
"dynamic.callable.missing" = "#ffbab1"
"dynamic.path" = { underline = true }

[metadata]
# Fall back to a dark built-in base for any uncovered scope.
extends = "patina"
