# eyes (light) — sage-green palette for zsh-patina.
# Token names mirror Catppuccin's example; only hex values are eyes.

# comments (c_ash from nvim eyes)
"comment" = "#504531"

# strings (c_green0: farther from the blue commands than c_green1)
"string" = "#294f01"

# regular expressions
"keyword.operator.regexp" = "#661b53"

# escape characters (c_pink)
"constant.character" = "#661b53"

# constants in general (c_orange0)
"constant" = "#5e2600"

# numeric literals (c_pink to match nvim Number)
"constant.numeric" = "#661b53"

# parameters
"variable.parameter" = "#5f3700"

# environment variables
"variable.other" = "#630005"
"punctuation.definition.variable" = "#630005"

# commands
"variable.function" = "#073c6e"

# home directory ~
"variable.language.tilde" = "#630005"

# keywords
"keyword" = "#3f206c"

# general foreground color
source = "#231d18"

# variable assignments
"storage" = "#574a00"
"storage.modifier" = "#3f206c"

# support terms (e.g. double braces, let)
"support" = "#073c6e"
"keyword.operator" = "#004d44"

# function names (c_blue1 from nvim eyes)
"entity.name.function" = "#00314e"

# braces (c_gray1 from nvim eyes)
"punctuation.section" = "#3b3931"

# terminators (e.g. ";;" after a case item)
"punctuation.terminator" = "#3b3931"

# history expansions
"meta.group.expansion.history" = "#630005"

# reset command substitutions to the theme's default foreground color
"meta.group.expansion.command.parens" = { foreground = "#231d18" }

# command call wrappers and option-argument values default to ANSI 7 (too dim)
"meta.function-call" = { foreground = "#231d18" }
"meta.function-call.arguments" = { foreground = "#231d18" }
"punctuation.definition.parameter" = { foreground = "#231d18" }

# line-continuation backslash also defaults to ANSI 7 (dim grey)
"punctuation.separator.continuation.line" = "#3b3931"

# dynamic items
"dynamic.callable" = "#073c6e"
"dynamic.callable.missing" = "#630005"
"dynamic.path" = { underline = true }

[metadata]
# Fall back to a light built-in base for any uncovered scope.
extends = "catppuccin-latte"
