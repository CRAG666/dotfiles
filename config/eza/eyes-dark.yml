colourful: true

filekinds:
  normal: {foreground: "#d5c9fc"}
  directory: {foreground: "#a8d7f0"}
  symlink: {foreground: "#96d4e2"}
  pipe: {foreground: "#efb7db"}
  block_device: {foreground: "#f4cb94"}
  char_device: {foreground: "#f4cb94"}
  socket: {foreground: "#efb7db"}
  special: {foreground: "#96d4e2"}
  executable: {foreground: "#96d4a6"}
  mount_point: {foreground: "#a8d7f0"}

perms:
  user_read: {foreground: "#ffbab1", is_bold: true}
  user_write: {foreground: "#f1de95", is_bold: true}
  user_execute_file: {foreground: "#96d4a6", is_bold: true}
  user_execute_other: {foreground: "#96d4a6", is_bold: true}
  group_read: {foreground: "#ffbab1"}
  group_write: {foreground: "#f1de95"}
  group_execute: {foreground: "#96d4a6"}
  other_read: {foreground: "#ffbab1"}
  other_write: {foreground: "#f1de95"}
  other_execute: {foreground: "#96d4a6"}
  special_user_file: {foreground: "#96d4e2"}
  special_other: {foreground: "#d0d4be"}
  attribute: {foreground: "#adbaa9"}

size:
  major: {foreground: "#f7bc95"}
  minor: {foreground: "#a8d7f0"}
  number_byte: {foreground: "#efb7db"}
  number_kilo: {foreground: "#f7bc95"}
  number_mega: {foreground: "#a8d7f0"}
  number_giga: {foreground: "#96d4e2"}
  number_huge: {foreground: "#96d4e2"}
  unit_byte: {foreground: "#f7bc95"}
  unit_kilo: {foreground: "#a8d7f0"}
  unit_mega: {foreground: "#96d4e2"}
  unit_giga: {foreground: "#96d4e2"}
  unit_huge: {foreground: "#a8d7f0"}

users:
  user_you: {foreground: "#bfe6a1"}
  user_root: {foreground: "#ffbab1"}
  user_other: {foreground: "#f4cb94"}
  group_yours: {foreground: "#f7bc95"}
  group_other: {foreground: "#adbaa9"}
  group_root: {foreground: "#ffbab1"}

links:
  normal: {foreground: "#96d4e2"}
  multi_link_file: {foreground: "#96d4e2"}

git:
  new: {foreground: "#96d4a6"}
  modified: {foreground: "#f1de95"}
  deleted: {foreground: "#f4cb94"}
  renamed: {foreground: "#a8d7f0"}
  typechange: {foreground: "#efb7db"}
  ignored: {foreground: "#b6b4ac"}
  conflicted: {foreground: "#d0c890"}

git_repo:
  branch_main: {foreground: "#f7bc95"}
  branch_other: {foreground: "#96d4e2"}
  git_clean: {foreground: "#96d4a6"}
  git_dirty: {foreground: "#f4cb94"}

security_context:
  colon: {foreground: "#b6b4ac"}
  user: {foreground: "#d0d4be"}
  role: {foreground: "#96d4e2"}
  typ: {foreground: "#adbaa9"}
  range: {foreground: "#96d4e2"}

file_type:
  image: {foreground: "#f1de95"}
  video: {foreground: "#ffbab1"}
  music: {foreground: "#96d4a6"}
  lossless: {foreground: "#a8d7f0"}
  crypto: {foreground: "#d0d4be"}
  document: {foreground: "#bfe6a1"}
  compressed: {foreground: "#efb7db"}
  temp: {foreground: "#f4cb94"}
  compiled: {foreground: "#95ded1"}
  source: {foreground: "#a8d7f0"}

punctuation: {foreground: "#b6b4ac"}
date: {foreground: "#f1de95"}
inode: {foreground: "#f7bc95"}
blocks: {foreground: "#b6b4ac"}
header: {foreground: "#bfe6a1"}
octal: {foreground: "#a8d7f0"}
flags: {foreground: "#96d4e2"}

symlink_path: {foreground: "#96d4e2"}
control_char: {foreground: "#95ded1"}
broken_symlink: {foreground: "#ffbab1"}
broken_path_overlay: {foreground: "#adbaa9"}
