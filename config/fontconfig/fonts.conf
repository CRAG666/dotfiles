<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
    <match target="pattern">
        <test name="family" qual="any">
            <string>DankMono Nerd Font Mono</string>
        </test>
        <edit name="spacing" mode="assign">
            <const>mono</const>
        </edit>
    </match>

    <!-- strong binding: fontconfig ranks a font's own genericfamily (which the
         Apple fonts lack) above a weak alias, so Nimbus would win otherwise -->
    <match target="pattern">
        <test name="family"><string>sans-serif</string></test>
        <edit name="family" mode="prepend" binding="strong"><string>SFProText Nerd Font Propo</string></edit>
    </match>
    <match target="pattern">
        <test name="family"><string>system-ui</string></test>
        <edit name="family" mode="prepend" binding="strong"><string>SFProText Nerd Font Propo</string></edit>
    </match>
    <match target="pattern">
        <test name="family"><string>serif</string></test>
        <edit name="family" mode="prepend" binding="strong"><string>NewYork Nerd Font Propo</string></edit>
    </match>
    <match target="pattern">
        <test name="family"><string>monospace</string></test>
        <edit name="family" mode="prepend" binding="strong"><string>SFMono Nerd Font Mono</string></edit>
    </match>
</fontconfig>
