[env]
# markitdown[all] (0.1.6+) pulls in azure-ai-contentunderstanding (pre-release) as a
# transitive dependency; uv rejects it by default. "allow" is the only mode that
# resolves it (the scoped modes don't cover transitive pre-releases). NOTE: it is global to uv.
UV_PRERELEASE = "allow"

[tools]
agy = "latest"
carapace = "latest"
"cargo:cpx" = "latest"
"cargo:tuicr" = "latest"
"cargo:zsh-patina" = "latest"
claude = "latest"
crush = "latest"
dotnet = "10.0"
"github:pdobsan/oama" = "latest"
herdr = "latest"
hunk = "latest"
node = "latest"
"npm:@fission-ai/openspec" = "latest"
"npm:oh-my-logo" = "latest"
opencode = "latest"
pi = "latest"
"pipx:BeatPrints" = "latest"
topgrade = "latest"
"github:immanuwell/dockerfile-roast" = "latest"
uv = "latest"
yq = "latest"
"npm:@firecrawl/anydoc" = "latest"
"github:canta2899/logo-ls" = "latest"
jq = "latest"
typst = "latest"
"pipx:notebooklm-py" = { version = "latest", extras = "browser" }

[settings]
minimum_release_age = "0"

[settings.pipx]
uvx = true
