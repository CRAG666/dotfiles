[env]
# markitdown[all] (0.1.6+) arrastra azure-ai-contentunderstanding (pre-release) como
# dependencia transitiva; uv la rechaza por defecto. "allow" es el único modo que la
# resuelve (los modos acotados no cubren pre-releases transitivas). OJO: es global a uv.
UV_PRERELEASE = "allow"

[tools]
agy = "latest"
carapace = "latest"
"cargo:cpx" = "latest"
"cargo:tuicr" = "latest"
"cargo:zsh-patina" = "latest"
claude = "latest"
crush = "latest"
dotnet = "10.0"
"github:pdobsan/oama" = "latest"
herdr = "latest"
hunk = "latest"
node = "latest"
"npm:@fission-ai/openspec" = "latest"
"npm:oh-my-logo" = "latest"
opencode = "latest"
pi = "latest"
"pipx:BeatPrints" = "latest"
topgrade = "latest"
"github:immanuwell/dockerfile-roast" = "latest"
uv = "latest"
yq = "latest"
"npm:@firecrawl/anydoc" = "latest"
"github:canta2899/logo-ls" = "latest"
jq = "latest"
codex = "latest"

[settings]
minimum_release_age = "0"

[settings.pipx]
uvx = true
