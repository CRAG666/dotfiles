[env]
# markitdown[all] (0.1.6+) pulls in azure-ai-contentunderstanding (pre-release) as a
# transitive dependency; uv rejects it by default. "allow" is the only mode that
# resolves it (the scoped modes don't cover transitive pre-releases). NOTE: it is global to uv.
UV_PRERELEASE = "allow"

[tools]
agy = "latest"
carapace = "latest"
"cargo:cpx" = "latest"
"cargo:tuicr" = "latest"
"cargo:zsh-patina" = "latest"
claude = "latest"
crush = "latest"
dotnet = "10.0"
"github:pdobsan/oama" = "latest"
"github:kovidgoyal/kitty" = { version = "latest", asset_pattern = "kitten-linux-amd64" }
herdr = "latest"
hunk = "latest"
node = "latest"
"npm:oh-my-logo" = "latest"
opencode = "latest"
pi = "latest"
"pipx:BeatPrints" = "latest"
ruff = "latest"
topgrade = "latest"
"github:immanuwell/dockerfile-roast" = "latest"
uv = "latest"
yq = "latest"
"npm:@firecrawl/anydoc" = "latest"
"github:canta2899/logo-ls" = "latest"
typst = "latest"
"pipx:notebooklm-py" = { version = "latest", extras = "browser" }
# tabctl install writes the mediator's versioned path into the native-messaging manifest, so rerun it on every upgrade
"github:slastra/tabctl" = { version = "latest", asset_pattern = "tabctl-linux-amd64-*.tar.gz", rename_exe = { "tabctl-linux-amd64" = "tabctl", "tabctl-mediator-linux-amd64" = "tabctl-mediator" }, postinstall = "tabctl install --browser Firefox" }

# Neovim LSP servers, linters and formatters; mason (vim.g.mason) keeps only what mise cannot install
bibtex-tidy = "latest"
lua-language-server = "latest"
marksman = "latest"
shellcheck = "latest"
shfmt = "latest"
stylua = "latest"
tinymist = "latest"
typstyle = "latest"
"aqua:mattn/efm-langserver" = "latest"
"aqua:Feel-ix-343/markdown-oxide" = "latest"
"github:latex-lsp/texlab" = "latest"
"github:ltex-plus/ltex-ls-plus" = "latest"
"github:WGUNDERWOOD/tex-fmt" = "latest"
"github:Samsung/netcoredbg" = "latest"
"github:microsoft/vscode-js-debug" = { version = "latest", asset_pattern = "js-debug-dap-*.tar.gz" }
"github:vadimcn/codelldb" = { version = "latest", asset_pattern = "codelldb-linux-x64.vsix", bin_path = "extension/adapter" }
"npm:@fsouza/prettierd" = "latest"
"npm:@olrtg/emmet-language-server" = "latest"
"npm:bash-language-server" = "latest"
# TypeScript 7 (native) serves the language server itself with `tsc --lsp`
"npm:typescript" = "latest"
ty = "latest"

[settings]
minimum_release_age = "0"

[settings.pipx]
uvx = true
