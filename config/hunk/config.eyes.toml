# Eyes — light variant. Sage-green palette (mirrors config/nvim/colors/eyes.lua).
# Generated dark variant: config.eyes-dark.toml (hand-tuned, kept in sync by hand).
theme = "custom"

[custom_theme]
base = "github-light-default"
label = "Eyes"
# UI surfaces — bg ladder
background = "#f7dbb9"
panel = "#f2d5b2"
panelAlt = "#edcfac"
border = "#392e23"
accent = "#073c6e"
accentMuted = "#473b2d"
text = "#231d18"
muted = "#483523"
# Diff line backgrounds — paler than the sage bg so strips pop
addedBg = "#e0f0d8"
removedBg = "#f4e0d4"
addedContentBg = "#b8d8a8"
removedContentBg = "#e0b8a4"
contextBg = "#f2d5b2"
contextContentBg = "#f7dbb9"
# Move detection — hue-distinct pale washes
movedAddedBg = "#d4e4c4"
movedRemovedBg = "#ecd8ec"
# Signs and gutter
addedSignColor = "#003d1b"
removedSignColor = "#630005"
lineNumberBg = "#f2d5b2"
lineNumberFg = "#473b2d"
selectedHunk = "#e6c7a3"
# Badges
badgeAdded = "#003d1b"
badgeRemoved = "#630005"
badgeNeutral = "#473b2d"
# File status
fileNew = "#003d1b"
fileDeleted = "#630005"
fileRenamed = "#574a00"
fileModified = "#073c6e"
fileUntracked = "#473b2d"
# Notes
noteBorder = "#392e23"
noteBackground = "#edcfac"
noteTitleBackground = "#dab992"
noteTitleText = "#231d18"

[custom_theme.syntax]
default = "#231d18"
keyword = "#630005"
string = "#294f01"
comment = "#3b3931"
number = "#3f206c"
function = "#073c6e"
property = "#004d44"
type = "#5f3700"
variable = "#31251a"
operator = "#504531"
punctuation = "#483523"
