# Eyes — dark variant. Forest palette (mirrors config/nvim/colors/eyes.lua).
# Hand-tuned counterpart of config.eyes.toml.
theme = "custom"

[custom_theme]
base = "github-dark-default"
label = "Eyes Dark"
# UI surfaces — bg ladder
background = "#192019"
panel = "#1f271f"
panelAlt = "#252f25"
border = "#667366"
accent = "#a2cdf7"
accentMuted = "#adbaa9"
text = "#e4e0cc"
muted = "#bbc7b0"
# Diff line backgrounds — darker than the forest bg so strips pop subtly
addedBg = "#324a2e"
removedBg = "#3f2e25"
addedContentBg = "#4a6646"
removedContentBg = "#714c41"
contextBg = "#1f271f"
contextContentBg = "#192019"
# Move detection — subtle saturated dark tints, hue-distinct
movedAddedBg = "#253525"
movedRemovedBg = "#322848"
# Signs and gutter
addedSignColor = "#bfe6a1"
removedSignColor = "#ffbab1"
lineNumberBg = "#1f271f"
lineNumberFg = "#adbaa9"
selectedHunk = "#2c372c"
# Badges
badgeAdded = "#bfe6a1"
badgeRemoved = "#ffbab1"
badgeNeutral = "#adbaa9"
# File status
fileNew = "#bfe6a1"
fileDeleted = "#ffbab1"
fileRenamed = "#f1de95"
fileModified = "#a2cdf7"
fileUntracked = "#adbaa9"
# Notes
noteBorder = "#667366"
noteBackground = "#252f25"
noteTitleBackground = "#3a463a"
noteTitleText = "#e4e0cc"

[custom_theme.syntax]
default = "#e4e0cc"
keyword = "#ffbab1"
string = "#bfe6a1"
comment = "#b6b4ac"
number = "#d5c9fc"
function = "#a2cdf7"
property = "#95ded1"
type = "#f4cb94"
variable = "#d0d4be"
operator = "#9fb9a1"
punctuation = "#bbc7b0"
