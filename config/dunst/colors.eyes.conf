# eyes theme colors for dunst. Loaded as a drop-in via the gitignored
# symlink dunstrc.d/50-colors.conf (drop-ins override dunstrc).
# The dark variant is regenerated with `eyes-theme generate` — edit only the light one.

[global]
frame_color = "#1e4868"
highlight = "#1e4868"

[urgency_low]
background = "#a4cc98"
foreground = "#1a1a1a"
frame_color = "#88b07e"

[urgency_normal]
background = "#add4a0"
foreground = "#1a1a1a"
frame_color = "#1e4868"

[urgency_critical]
background = "#add4a0"
foreground = "#1a1a1a"
frame_color = "#7a1e18"
