# eyes theme colors for dunst. Loaded as a drop-in via the gitignored
# symlink dunstrc.d/50-colors.conf (drop-ins override dunstrc).
# The dark variant is regenerated with `eyes-theme generate` — edit only the light one.

[global]
frame_color = "#6a94a8"
highlight = "#6a94a8"

[urgency_low]
background = "#202820"
foreground = "#d0dcc8"
frame_color = "#3a463a"

[urgency_normal]
background = "#1a211a"
foreground = "#d0dcc8"
frame_color = "#6a94a8"

[urgency_critical]
background = "#1a211a"
foreground = "#d0dcc8"
frame_color = "#c87868"
