# Base de herdr (todo menos la paleta). config.toml lo ensambla eyes-theme
# concatenando este archivo + colors.eyes[-dark].toml, porque herdr no
# soporta include: un solo archivo con colores inline.
# La paleta dark se genera desde el light con `eyes-theme generate`.

onboarding = false

[theme]
# Base "terminal": los colores derivados siguen la paleta ANSI de kitty,
# que eyes-theme ya intercambia en sincronía. La paleta eyes exacta
# (bg1/bg3/bg4 no-ANSI) vive en colors.eyes[-dark].toml.
name = "terminal"

[terminal]
# Igual que kitty.conf: paneles nuevos en nu ($SHELL es zsh)
default_shell = "nu"

[keys]
# El prefix no puede ser un modificador solo ("alt"): herdr necesita una
# tecla concreta que el terminal transmita.
# ctrl+space = verificado libre en todo el stack (2025): scroll usa
# $mod=Mod4 y ninguno de sus bindsym toca space; kitty no lo mapea;
# nvim/nu/zsh sin bindings (y herdr se come el NUL antes de nvim, asi que
# ni siquiera dispara el default i_CTRL-@); sin fcitx/ibus que lo robe como
# conmutador de IME. Unico riesgo prospectivo: <C-Space> es el mapping
# tipico de completion (nvim-cmp) si algun dia lo agregas.
# Bonus: al liberar alt+space, queda libre para el hyprlock del config
# legacy de hypr (bindd = ALT, Space) por si ese WM vuelve.
# Ojo: en tus teclados space es LT(2) (hold = capa de navegacion):
# dale el toque corto; si lo mantienes se activa la capa y el prefix
# no dispara (inofensivo, reintenta).
# Descartados: alt+a/i/d/h/l (nvim), alt+backspace/alt+enter (shells/nu)
prefix = "ctrl+space"
# Alternativas sin choque:
#   prefix = "alt+space" # ambos pulgares, verificado (choca con hyprlock legacy de hypr)
#   prefix = "alt+j"     # pulgar derecho + indice home, una mano
#   prefix = "f17"       # MO(4)+N en tu keychron: tecla virtual, cero choques

# Vim-style. Un binding custom sustituye al default completo (no se añade).
goto         = "prefix+space"  # picker: <leader><space> de telescope/fzf (antes prefix+g)
next_tab     = "prefix+t"      # vim gt
previous_tab = "prefix+shift+t" # vim gT (libera shift+t de rename)
rename_tab   = "prefix+comma"  # tmux rename-window
last_pane    = "prefix+enter"  # jumplist ctrl+o: volver al último pane
new_worktree = "prefix+g"      # liberado al mover goto a prefix+space (antes prefix+shift+g)
new_tab      = ["prefix+n", "prefix+c"] # n = new (c de tmux como secundario)
# Ya ergonómicos de serie (defaults): focus hjkl, swap shift+hjkl, zoom z,
# copy [, resize r, switch_tab prefix+1..9 (={N}gt).

# Migración desde kitty: descomenta al borrar los map alt+* de kitty.conf
# (mientras existan ahí, kitty intercepta los acordes antes que herdr).
# new_tab         = ["prefix+c", "alt+;"]
# next_tab        = ["prefix+n", "alt+."]
# previous_tab    = ["prefix+p", "alt+,"]
# split_vertical  = ["prefix+v", "alt+/"]
# close_pane      = ["prefix+x", "alt+backspace"]
# focus_pane_left  = ["prefix+h", "alt+left"]
# focus_pane_down  = ["prefix+j", "alt+down"]
# focus_pane_up    = ["prefix+k", "alt+up"]
# focus_pane_right = ["prefix+l", "alt+right"]
# swap_pane_left   = ["prefix+shift+h", "ctrl+alt+h"]
# swap_pane_down   = ["prefix+shift+j", "ctrl+alt+j"]
# swap_pane_up     = ["prefix+shift+k", "ctrl+alt+k"]
# swap_pane_right  = ["prefix+shift+l", "ctrl+alt+l"]

[ui]
# Ocultar sidebar y tab bar: sidebar a ancho cero desde el arranque,
# fila de tabs oculta mientras solo haya un tab.
sidebar_start_collapsed = true
sidebar_collapsed_mode = "hidden"
hide_tab_bar_when_single_tab = true

[ui.toast]
delivery = "system"
