# herdr base (everything but the palette). eyes-theme assembles config.toml
# by concatenating this file + colors.eyes[-dark].toml, because herdr does not
# support include: a single file with inline colors.
# The dark palette is NOT generated: manual pair with its own accents (see
# local/share/eyes-theme/manifest.toml). Edit colors.eyes.toml AND colors.eyes-dark.toml.

onboarding = false

[theme]
# "terminal" base: derived colors follow kitty's ANSI palette,
# which eyes-theme already swaps in sync. The exact eyes palette
# (non-ANSI bg1/bg3/bg4) lives in colors.eyes[-dark].toml.
name = "terminal"

[terminal]
# Same as kitty.conf: new panes in nu ($SHELL is zsh)
default_shell = "nu"

[keys]
# The prefix cannot be a bare modifier ("alt"): herdr needs a
# concrete key that the terminal transmits.
# ctrl+space = verified free across the whole stack (2025): scroll uses
# $mod=Mod4 and none of its bindsym touch space; kitty doesn't map it;
# nvim/nu/zsh have no bindings (and herdr eats the NUL before nvim, so it
# doesn't even fire the default i_CTRL-@); no fcitx/ibus to steal it as an
# IME toggle. Only prospective risk: <C-Space> is the typical completion
# mapping (nvim-cmp) if you ever add it.
# Bonus: freeing alt+space leaves it available for hyprlock in the
# legacy hypr config (bindd = ALT, Space) in case that WM comes back.
# Careful: on your keyboards space is LT(2) (hold = navigation layer):
# tap it briefly; if you hold it the layer activates and the prefix
# doesn't fire (harmless, retry).
# Discarded: alt+a/i/d/h/l (nvim), alt+backspace/alt+enter (shells/nu)
prefix = "ctrl+space"
# Clash-free alternatives:
#   prefix = "alt+space" # both thumbs, verified (clashes with legacy hypr hyprlock)
#   prefix = "alt+j"     # right thumb + home index finger, one hand
#   prefix = "f17"       # MO(4)+N on your keychron: virtual key, zero clashes

# Vim-style. A custom binding replaces the whole default (it is not appended).
goto         = "prefix+space"  # picker: <leader><space> from telescope/fzf (was prefix+g)
next_tab     = "prefix+t"      # vim gt
previous_tab = "prefix+shift+t" # vim gT (frees shift+t from rename)
rename_tab   = "prefix+comma"  # tmux rename-window
last_pane    = "prefix+enter"  # jumplist ctrl+o: back to the last pane
new_worktree = "prefix+g"      # freed by moving goto to prefix+space (was prefix+shift+g)
new_tab      = ["prefix+n", "prefix+c"] # n = new (tmux's c as secondary)
# Already ergonomic out of the box (defaults): focus hjkl, swap shift+hjkl, zoom z,
# copy [, resize r, switch_tab prefix+1..9 (={N}gt).

# Migration from kitty: uncomment when removing the alt+* maps from kitty.conf
# (while they exist there, kitty intercepts the chords before herdr).
# new_tab         = ["prefix+c", "alt+;"]
# next_tab        = ["prefix+n", "alt+."]
# previous_tab    = ["prefix+p", "alt+,"]
# split_vertical  = ["prefix+v", "alt+/"]
# close_pane      = ["prefix+x", "alt+backspace"]
# focus_pane_left  = ["prefix+h", "alt+left"]
# focus_pane_down  = ["prefix+j", "alt+down"]
# focus_pane_up    = ["prefix+k", "alt+up"]
# focus_pane_right = ["prefix+l", "alt+right"]
# swap_pane_left   = ["prefix+shift+h", "ctrl+alt+h"]
# swap_pane_down   = ["prefix+shift+j", "ctrl+alt+j"]
# swap_pane_up     = ["prefix+shift+k", "ctrl+alt+k"]
# swap_pane_right  = ["prefix+shift+l", "ctrl+alt+l"]

[ui]
# Hide sidebar and tab bar: zero-width sidebar from startup,
# tab row hidden while there is only one tab.
sidebar_start_collapsed = true
sidebar_collapsed_mode = "hidden"
hide_tab_bar_when_single_tab = true

[ui.toast]
delivery = "system"

[experimental]
kitty_graphics = true
