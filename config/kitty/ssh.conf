# kitten ssh — shared config (alias `ssh`/`s`). terminfo is always copied.
# Docs: https://sw.kovidgoyal.net/kitty/kittens/ssh/

hostname *
    shell_integration enabled
    # Multiplexing: instant reconnections to the same host.
    share_connections yes
    # Only terminfo + shell integration; nothing installed on the remote.
    remote_kitty no
