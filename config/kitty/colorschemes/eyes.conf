# vim:ft=kitty
## name:     Eyes (Light)
## blurb:    Calm sage-green light theme designed for eye comfort.
##           ANSI hues follow nvim eyes.lua terminal_color_* (light);
##           slots 0/7/8/15 keep standard semantics so TUIs render correctly.
##           Every (color0/colorN) pair is AA-readable.

# Basic
foreground              #231d18
background              #f7dbb9
selection_foreground    #231d18
selection_background    #dab992

# Cursor
cursor                  #231d18
cursor_text_color       #f7dbb9

# Scrollbar
scrollbar_handle_color  #473b2d
scrollbar_track_color   #e6c7a3

# URL hover
url_color               #073c6e

# Window borders
active_border_color     #073c6e
inactive_border_color   #b1936e
bell_border_color       #630005

# OS titlebar
wayland_titlebar_color  system
macos_titlebar_color    system

# Tab bar
active_tab_foreground   #231d18
active_tab_background   #f2d5b2
inactive_tab_foreground #31251a
inactive_tab_background #dab992
tab_bar_background      #f7dbb9

# Marks (use light fg, dark bg — readable in both directions)
mark1_foreground        #f7dbb9
mark1_background        #073c6e
mark2_foreground        #f7dbb9
mark2_background        #3f206c
mark3_foreground        #f7dbb9
mark3_background        #004d44

# --- ANSI 0-15 -------------------------------------------------------------
# Normal
color0  #231d18
color1  #630005
color2  #003d1b
color3  #574a00
color4  #00314e
color5  #3f206c
color6  #003e4c
color7  #dab992

# Bright
color8  #473b2d
color9  #630005
color10 #294f01
color11 #5f3700
color12 #073c6e
color13 #661b53
color14 #004d44
color15 #f2d5b2

# Extended 16-255: keep only the ones kitty needs for special fallbacks.
# Most modern apps use truecolor and ignore these.
color16 #5e2600
color17 #5f3700
