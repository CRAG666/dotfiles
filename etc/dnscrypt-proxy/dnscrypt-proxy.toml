# dnscrypt-proxy: encrypted DNS egress over DoH (port 443).
# unbound forwards here ONLY when unbound-forward detects port 53
# blocked (e.g. lab). At home unbound recurses and this stays idle.
# DoH only -> always 443 -> gets through firewalls that filter 53/853.

listen_addresses = ['127.0.0.1:5300']     # 5300 to avoid clashing with avahi/mDNS (5353)
max_clients = 250

ipv4_servers = true
ipv6_servers = false

# DoH only: guarantees EVERYTHING goes out via 443 (the only port open in the lab).
doh_servers = true
dnscrypt_servers = false
odoh_servers = false

# Pick only resolvers that don't log and that validate DNSSEC.
require_dnssec = true
require_nolog = true
require_nofilter = true

# Don't read /etc/resolv.conf (it points to unbound -> loop).
ignore_system_dns = true

# Bootstrap and netprobe ONLY via loopback (unbound): the firewall only allows
# outbound 53 for unbound, so pointing at 9.9.9.9:53 would get dropped and stall
# startup. The DoH stamps (Cloudflare/Quad9) carry IPs -> a cold start needs no
# hostname resolution. Do the FIRST start at home to cache the list.
bootstrap_resolvers = ['127.0.0.1:53']
netprobe_timeout = 60
netprobe_address = '127.0.0.1:53'

# unbound already caches; don't duplicate.
cache = false

[sources]
  [sources.public-resolvers]
  urls = ['https://raw.githubusercontent.com/DNSCrypt/dnscrypt-resolvers/master/v3/public-resolvers.md', 'https://download.dnscrypt.info/resolvers-list/v3/public-resolvers.md', 'https://cdn.jsdelivr.net/gh/DNSCrypt/dnscrypt-resolvers@master/v3/public-resolvers.md']
  cache_file = '/var/cache/dnscrypt-proxy/public-resolvers.md'
  minisign_key = 'RWQf6LRCGA9i53mlYecO4IzT51TGPpvWucNSCh1CBM0QTaLn73Y7GFO3'
