#!/hint/bash
# Sourced after makepkg.conf and rust.conf (alphabetical); the last -march/-mtune/target-cpu wins.
CFLAGS+=" -march=native -mtune=native"
CXXFLAGS+=" -march=native -mtune=native"
RUSTFLAGS+=" -C target-cpu=native"
export GOAMD64=v3
# ~2 GB RAM per job: same file is safe on the 64 GB P53 and the 16 GB L14.
_nproc=$(nproc)
_memjobs=$(( ($(awk '/MemTotal/ {print $2}' /proc/meminfo) / 1024 / 1024 - 1) / 2 ))
_jobs=$(( _memjobs < 1 ? 1 : _memjobs < _nproc ? _memjobs : _nproc ))
MAKEFLAGS="-j$_jobs -l$_nproc"
NINJAFLAGS="-j$_jobs -l$_nproc"
unset _nproc _memjobs _jobs
