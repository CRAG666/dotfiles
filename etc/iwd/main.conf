[General]
EnableNetworkConfiguration=true

[DriverQuirks]
# Keep the kernel's wlan0 so it survives iwd restarts and iwd.service.d/wait-wlan0.conf can wait for it
DefaultInterface=*

[Network]
# resolv.conf is static (unbound on 127.0.0.1); iwd must not touch it.
NameResolvingService=none

[Rank]
# Rank = estimated data rate x band factor: 5 GHz wins unless it is under half as fast
BandModifier5GHz=2.0
