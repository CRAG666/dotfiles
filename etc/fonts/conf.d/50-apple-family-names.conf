<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
    <!-- nerd-fonts-apple ships corrupt family names for the non-Regular/Bold
         weights, which leaves Medium, SemiBold, Light... unreachable -->
    <match target="scan">
        <test name="file" compare="contains"><string>/SFProTextNerdFontPropo-</string></test>
        <edit name="family" mode="assign_replace"><string>SFProText Nerd Font Propo</string></edit>
    </match>
    <match target="scan">
        <test name="file" compare="contains"><string>/SFProDisplayNerdFontPropo-</string></test>
        <edit name="family" mode="assign_replace"><string>SFProDisplay Nerd Font Propo</string></edit>
    </match>
    <match target="scan">
        <test name="file" compare="contains"><string>/SFRoundedNerdFontPropo-</string></test>
        <edit name="family" mode="assign_replace"><string>SFRounded Nerd Font Propo</string></edit>
    </match>
</fontconfig>
