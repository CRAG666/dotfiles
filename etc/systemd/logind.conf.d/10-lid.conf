# Suspender al cerrar la tapa (batería o corriente), SALVO en modo docked:
# logind considera "docked" tener más de una pantalla conectada o estar en dock.
# El bloqueo al cerrar la tapa lo hace scroll (bindswitch lid:on);
# swayidle (before-sleep) cubre además cualquier suspensión.
[Login]
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=suspend
HandleLidSwitchDocked=ignore
