# Suspend on lid close (battery or AC), EXCEPT in docked mode:
# logind treats having more than one display connected, or a dock, as "docked".
# Locking on lid close is handled by scroll (bindswitch lid:on);
# swayidle (before-sleep) also covers any suspend.
[Login]
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=suspend
HandleLidSwitchDocked=ignore
