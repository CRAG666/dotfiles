#!/usr/sbin/nft -f

# vim:set ts=2 sw=2 et:

define soulseek_port = 2234
define torrent_port = 33133

destroy table inet filter

table inet filter {

  set tailnet_services {
    typeof meta l4proto . th dport
    elements = {
      tcp . 22 comment "SSH",
      tcp . 47984 comment "Sunshine HTTPS",
      tcp . 47989 comment "Sunshine HTTP",
      tcp . 47990 comment "Sunshine web UI",
      tcp . 48010 comment "Sunshine RTSP",
      udp . 47998 comment "Sunshine vídeo",
      udp . 47999 comment "Sunshine control",
      udp . 48000 comment "Sunshine audio",
      tcp . 22000 comment "Syncthing TCP",
      udp . 22000 comment "Syncthing QUIC",
    }
  }

  set egress_services {
    typeof meta l4proto . th dport
    elements = {
      tcp . 80 comment "HTTP",
      tcp . 443 comment "HTTPS + Tailscale DERP",
      udp . 443 comment "HTTP/3 / QUIC",
      tcp . 465 comment "SMTPS",
      tcp . 587 comment "SMTP submission",
      tcp . 143 comment "IMAP",
      tcp . 993 comment "IMAPS",
      tcp . 22 comment "SSH",
      tcp . 22025 comment "SSH INAOE",
      tcp . 8312 comment "SSH INAOE",
      tcp . $soulseek_port comment "Soulseek peers",
      tcp . 2242 comment "Soulseek servidor",
      tcp . 51413 comment "Torrent TCP (peers en el puerto por defecto)",
      udp . 51413 comment "Torrent UDP (peers en el puerto por defecto)",
      udp . 3478 comment "Tailscale STUN",
    }
  }

  set egress_by_user {
    typeof meta skuid . meta l4proto . th dport
    elements = {
      unbound . udp . 53 comment "Unbound recursivo UDP",
      unbound . tcp . 53 comment "Unbound recursivo TCP",
      systemd-timesync . udp . 123 comment "NTP (systemd-timesyncd)",
    }
  }

  # Rate sets expire idle sources; ct count sets reject a timeout and empty themselves.
  set syn_rate4 { type ipv4_addr; flags dynamic; timeout 1m; size 65536; }
  set syn_rate6 { type ipv6_addr; flags dynamic; timeout 1m; size 65536; }
  set slsk_rate4 { type ipv4_addr; flags dynamic; timeout 1m; size 65536; }
  set conn_count4 { type ipv4_addr; flags dynamic; size 65536; }
  set conn_count6 { type ipv6_addr; flags dynamic; size 65536; }

  chain related_in {
    icmp type redirect drop comment "ICMP redirect"
    accept
  }

  # Only SYNs get here; IPv6 sources are keyed by /64.
  chain public_tcp {
    update @syn_rate4 { ip saddr limit rate over 25/second burst 50 packets } \
        counter drop comment "SYN flood por IP (v4)"
    update @syn_rate6 { ip6 saddr & ffff:ffff:ffff:ffff:: limit rate over 25/second burst 50 packets } \
        counter drop comment "SYN flood por /64 (v6)"
    add @conn_count4 { ip saddr ct count over 30 } \
        counter drop comment "Demasiadas conexiones por IP (v4)"
    add @conn_count6 { ip6 saddr & ffff:ffff:ffff:ffff:: ct count over 30 } \
        counter drop comment "Demasiadas conexiones por /64 (v6)"
    tcp dport $soulseek_port update @slsk_rate4 { ip saddr limit rate over 10/minute burst 5 packets } \
        counter drop comment "Soulseek 10/min por IP"
    accept
  }

  # Before conntrack, so spoofed packets cannot ride an established flow.
  chain prerouting {
    type filter hook prerouting priority raw; policy accept;

    fib saddr . iif oif missing counter drop comment "Reverse-path filter"
  }

  chain input {
    type filter hook input priority filter; policy drop;

    iif lo accept comment "Loopback interno"
    ct state vmap { established : accept, related : goto related_in, invalid : drop }

    # Past this point every packet is new or untracked; ICMP errors arrive as related.
    tcp flags != syn / fin,syn,rst,ack counter drop comment "TCP nuevo sin SYN"

    icmp type echo-request limit rate 1/second burst 5 packets accept comment "Ping entrante (1/s)"
    icmpv6 type echo-request limit rate 1/second burst 5 packets accept comment "Ping6 entrante (1/s)"
    icmpv6 type {
        nd-router-solicit,
        nd-router-advert,
        nd-neighbor-solicit,
        nd-neighbor-advert,
        mld-listener-query,
        mld-listener-report,
        mld-listener-done,
        mld2-listener-report,
    } accept comment "NDP + MLD (RFC 4890 §4.4.1)"
    meta l4proto igmp drop comment "IGMP (descarte sin log)"
    ip6 saddr fe80::/10 udp sport 547 udp dport 546 accept comment "Respuestas DHCPv6"

    iifname "tailscale0" meta l4proto . th dport @tailnet_services accept comment "Servicios solo sobre el tailnet"
    udp dport $torrent_port accept comment "Torrent UDP"
    tcp dport $torrent_port goto public_tcp comment "Torrent"
    meta nfproto ipv4 tcp dport $soulseek_port goto public_tcp comment "Soulseek (protocolo solo IPv4)"

    limit rate 10/minute burst 20 packets \
        log prefix "nftables-INPUT-DROP: " flags all counter \
        comment "Log drops (rate-limited para evitar saturación)"
  }

  chain forward {
    type filter hook forward priority filter; policy drop;
    counter comment "Forward siempre drop — no somos router"
  }

  chain output {
    type filter hook output priority filter; policy drop;

    oif lo accept comment "Loopback interno"
    ct state vmap { established : accept, related : accept, invalid : drop }

    oifname "tailscale0" accept comment "Egress dentro del tailnet"
    meta l4proto . th dport @egress_services accept
    meta skuid . meta l4proto . th dport @egress_by_user accept
    udp dport 6881-6889 accept comment "Torrent DHT"
    udp sport 41641 accept comment "Tailscale WireGuard (peers tras NAT usan cualquier puerto)"
    ip daddr 192.100.172.6 tcp dport 3128 accept comment "Proxy Squid INAOE"

    icmp type echo-request accept comment "Ping saliente"
    icmpv6 type {
        echo-request,
        nd-neighbor-solicit,
        nd-neighbor-advert,
        nd-router-solicit,
        mld-listener-report,
        mld-listener-done,
        mld2-listener-report,
    } accept comment "Ping6 saliente + NDP + MLD"
    meta l4proto igmp drop comment "IGMP (descarte sin log)"
    udp sport 68 udp dport 67 accept comment "DHCP IPv4"
    ip6 saddr fe80::/10 udp sport 546 udp dport 547 accept comment "DHCPv6 link-local"

    limit rate 10/minute burst 20 packets \
        log prefix "nftables-OUTPUT-DROP: " flags all counter \
        comment "Log drops (rate-limited)"
    reject with icmpx admin-prohibited
  }

}
