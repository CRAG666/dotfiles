# Light palettes for `eyes-theme variant <name>`. The active one is the light
# column of manifest.toml's [palette]; switching rewrites it in place in every
# tracked file. The dark column is shared by all of them.

# The palette light mode uses; light, dark, toggle, auto and reapply switch to
# it when the active one differs, and `eyes-theme variant <name>` sets it.
light = "peach"

# Light sage, near the green of Li et al. 2025 (OKLCH L 0.905, C 0.046, h 142).
[sage]
bg0          = "cfe8cc"
bg1          = "c8e3c6"
bg2          = "c2dec0"
bg3          = "bad6b8"
bg4          = "abc9a8"
bg5          = "85a183"
