unbind ^b
set -g prefix ^a
bind C-a send-prefix
set -g mouse on
set -s escape-time 0
set -g history-limit 10000
set -ga terminal-overrides ",*256col*:Tc"

setw -g mode-keys vi
set -g status-keys vi
bind-key -T copy-mode-vi v   send-keys -X begin-selection
bind-key -T copy-mode-vi V   send-keys -X select-line
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
# Termux takes the copy into the Android clipboard through OSC 52
bind-key -T copy-mode-vi y   send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi Escape send-keys -X cancel
set -g status-position top
bind c new-window      -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# No eyes-theme on the phone: the server picks the variant by the hour it starts, as `eyes-theme auto` does
if-shell '[ "$(date +%-H)" -ge 6 ] && [ "$(date +%-H)" -lt 19 ]' \
    'source-file ~/.tmux.colors.eyes.conf' \
    'source-file ~/.tmux.colors.eyes-dark.conf'
# The theme redraws every second, too often on battery
set -g status-interval 15
