# ─── eyes (light) theme ──────────────────────────────────────────────────────
# Palette:
#   bg0  #f7dbb9   bg1  #f2d5b2   bg3  #e6c7a3   bg4  #dab992   bg5  #b1936e
#   fg0  #231d18   fg1  #31251a   fg2  #483523
#   red  #630005   green #294f01  yellow #574a00  blue #073c6e
#   teal #004d44   violet #3f206c  pink #661b53  ash  #504531

# Pane borders
set -g pane-border-style fg='#dab992'
set -g pane-active-border-style fg='#073c6e'

# Messages / command prompt
set -g message-style bg='#f2d5b2',fg='#231d18'
set -g message-command-style bg='#f2d5b2',fg='#231d18'

# Status bar
set -g status-style bg='#f2d5b2',fg='#231d18'
set -g status-interval 1
set -g status-justify left

# Left: prefix indicator + zoom
set -g status-left '#[bg=#f2d5b2,fg=#073c6e,bold]#{?client_prefix,#[bg=#630005#,fg=#f7dbb9],}  '
set -ga status-left '#[bg=#f2d5b2,fg=#630005]#{?window_zoomed_flag, ↕  ,   }'

# Window status (inactive / active)
set-window-option -g window-status-style fg='#483523',bg='#f2d5b2'
set-window-option -g window-status-current-style fg='#f7dbb9',bg='#073c6e',bold
set -g window-status-current-format "#[fg=#f2d5b2,bg=#073c6e]#[fg=#f7dbb9,bg=#073c6e,bold] #I  #W #[fg=#073c6e,bg=#f2d5b2]"
set -g window-status-format "#[fg=#f2d5b2,bg=#dab992]#[fg=#231d18,bg=#dab992] #I  #W #[fg=#dab992,bg=#f2d5b2]"

# Right: session, pane, window
set -g status-right '#[fg=#dab992,bg=#f2d5b2]#[fg=#231d18,bg=#dab992]  #S '
set -ga status-right '#[fg=#3f206c,bg=#dab992]#[fg=#f7dbb9,bg=#3f206c]  #P '
set -ga status-right '#[fg=#630005,bg=#3f206c]#[fg=#f7dbb9,bg=#630005]  %H:%M '

# Clock mode
set -g clock-mode-colour '#073c6e'
set -g clock-mode-style 24

# Copy mode highlight
set -g mode-style bg='#073c6e',fg='#f7dbb9'
